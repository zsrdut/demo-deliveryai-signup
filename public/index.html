<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>技术分享会 · 报名</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <h1>技术分享会 · 报名</h1>
    <p class="sub">11月底 · 14:00 · 三层报告厅 · 限 50 人</p>

    <form id="form" class="card">
      <label>姓名<input name="name" placeholder="张三"></label>
      <label>工号<input name="employeeId" placeholder="A12345"></label>
      <label>部门<input name="department" placeholder="基础架构"></label>
      <button type="submit">提交报名</button>
      <p id="message" class="message"></p>
    </form>

    <section class="card">
      <h2>已报名 <span id="count">0</span>/50</h2>
      <ol id="list" class="list"></ol>
    </section>
  </main>
  <script>
    const form = document.getElementById('form');
    const message = document.getElementById('message');
    const list = document.getElementById('list');
    const count = document.getElementById('count');

    function say(text, ok) {
      message.textContent = text;
      message.className = 'message ' + (ok ? 'ok' : 'error');
    }

    async function refresh() {
      const res = await fetch('/api/signups');
      const data = await res.json();
      count.textContent = data.total;
      list.innerHTML = data.items
        .map((i) => `<li><b>${i.seq}</b>${i.name} · ${i.department} · ${i.employeeId}</li>`)
        .join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(form));
      const res = await fetch('/api/signups', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        say(`报名成功，你是第 ${data.seq} 位`, true);
        form.reset();
        refresh();
      } else {
        say(data.error || '提交失败', false);
      }
    });

    refresh();
  </script>
</body>
</html>
